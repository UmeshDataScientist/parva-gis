<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web GIS Dashboard - Parva Planning and Infrastructure</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <script>
        // Secure redirect to login if session is absent
        if (localStorage.getItem('gis_logged_in') !== 'true') {
            window.location.assign('./login.html');
        }
    </script>

    <header class="navbar">
        <div class="brand-title">Parva Planning and Infrastructure</div>
        <div class="header-info">
            <span id="dateTimeDisplay"></span>
            <span class="visitor-tag">Visitors: <strong id="visitorCount">1,482</strong></span>
            <button onclick="localStorage.removeItem('gis_logged_in'); window.location.assign('./login.html');" class="btn-logout">Logout</button>
        </div>
    </header>

    <div class="control-subpanel">
        <div class="filter-group">
            <select id="districtFilter">
                <option value="">Select District</option>
            </select>
            <select id="talukFilter" disabled>
                <option value="">Select Taluk</option>
            </select>
            <select id="layoutFilter" disabled>
                <option value="">Select Layout</option>
            </select>
        </div>
        
        <div class="search-group">
            <input type="text" id="propertySearchInput" placeholder="Optional: Property No..." disabled>
            <button id="btnSearch" disabled>Search</button>
            <button id="btnReset" class="btn-secondary">Reset View</button>
        </div>
    </div>

    <div id="map"></div>

    <footer class="coordinates-footer">
        <span>Coordinates: <strong id="mouseCoordinates">Latitude: 0.00000, Longitude: 0.00000</strong></span>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
